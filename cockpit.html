/* Runtime operator surface: shared seat theme, static and responsive. */
html,body{min-width:0}body{background:var(--bg);color:var(--text)}
.top{background:rgb(var(--panel-rgb) / .94);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.brand b{font-size:21px;letter-spacing:.14em;color:var(--accent);text-shadow:0 0 18px rgb(var(--accent-rgb) / .24)}
.card,.capcard{background:linear-gradient(145deg,var(--panel),var(--bg-2));border-color:var(--line-2);border-radius:18px}
.capcard:hover{border-color:var(--accent)}.hero h1{letter-spacing:-.045em}.btn{border-radius:10px}
main{max-width:1440px;margin:auto}.grid>*{min-width:0}.scroll{max-width:100%;overflow:auto}

</style></head><body>
<nav class="top" aria-label="creator-os runtime" id="nav"></nav>
<div id="tick"></div>
<main id="app"></main>
<footer><span>creator-os runtime · RightOnPar LLC · agents hold grants, never keys</span><span>machine surface: <a href="/routes">/routes</a> · <a href="/mcp">/mcp</a> · <a href="/.well-known/creator-os.json">manifest</a> · <a href="/docs">/docs</a> · <a href="/selftest">/selftest</a></span></footer>
<script>
// creator-os runtime cockpit — human surface, MeshTool estate look (Piano Neon). Hub-and-spoke: one hub, an index of pages, one thing per page, always a way back.
const PAGES = {
  memory:   { title: "Memory",   kick: "remember", one: "What the box remembers, in the order it happened." },
  tenants:  { title: "Tenants",  kick: "who",      one: "Who is on the box and what tier they're on.",             api: "/api/tenants",       cols: ["id","name","tier","status","deploys_period","created_at"] },
  grants:   { title: "Grants",   kick: "power",    one: "Every capability that exists right now, and what's left.", api: "/api/admin/grants",  cols: ["id","tenant","sub","depth","status","remaining","exp"] },
  deploys:  { title: "Workers",  kick: "exit",     one: "What's deployed, planned, or failed.",                      api: "/api/admin/deploys", cols: ["id","tenant","name","template","status","executed","created_at"] },
  ledger:   { title: "Ledger",   kick: "money",    one: "Every reserve, settle and release — the money trail.",      api: "/api/admin/ledger",  cols: ["id","ts","tenant","grant_id","kind","usd_cents","calls","deploys","note"] },
  events:   { title: "Events",   kick: "bus",      one: "The bus: what the COG and agents did, in order.",           api: "/api/admin/events",  cols: ["id","ts","tenant","type","actor","data"] },
  webhooks: { title: "Webhooks", kick: "intake",   one: "What arrived from Stripe, Railway, GitHub, Brain, Mesh.",   api: "/api/admin/webhooks",cols: ["id","source","type","received_at","handled","result"] },
  outbox:   { title: "Outbox",   kick: "fan-out",  one: "What's on its way to the Brain and the memory bridge.",      api: "/api/admin/outbox",  cols: ["id","kind","attempts","next_at","done","last_error","created_at"] },
};
const PALS = [["piano", "Piano Neon", "#F5C542", "#050506"], ["ember", "Ember Ink", "#FF6B2C", "#0B0E1A"], ["v1", "Cyan/Lime v1", "#2DE2F0", "#06080A"]];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const hasKey = () => { try { return !!sessionStorage.getItem("cos_admin"); } catch { return false; } };
const KEY = () => { try { let k = sessionStorage.getItem("cos_admin"); if (!k) { k = (prompt("Admin key (kept in this tab only)") || "").trim(); if (k) sessionStorage.setItem("cos_admin", k); } return k || ""; } catch { return (prompt("Admin key") || "").trim(); } };
const lock = () => { try { sessionStorage.removeItem("cos_admin"); } catch {} route(); };
const get = async p => { const r = await fetch(p, { headers: { authorization: "Bearer " + KEY() } }); if (r.status === 401) { try { sessionStorage.removeItem("cos_admin"); } catch {} } return r.json().catch(() => ({ error: "bad_response" })); };
const post = async p => fetch(p, { method: "POST", headers: { authorization: "Bearer " + KEY() } }).then(r => r.json()).catch(() => ({ error: "bad_response" }));
let HEALTH = null;
const health = async () => (HEALTH = await fetch("/health").then(r => r.json()).catch(() => ({ ok: false, armed: {} })));
const fmtTs = v => { const d = new Date(typeof v === "number" && v < 1e12 ? v * 1000 : v); return isNaN(d) ? esc(v) : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); };
const hhmm = v => new Date(v).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const ago = ms => { const s = Math.max(0, (Date.now() - ms) / 1000); return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + "m ago" : s < 86400 ? Math.floor(s / 3600) + "h ago" : Math.floor(s / 86400) + "d ago"; };
const TONE = { active: "ok", online: "ok", settled: "ok", success: "ok", deployed: "ok", done: "ok", true: "ok", root: "agt", reserve: "acc", settle: "ok", release: "dim", revoked: "bad", failed: "bad", crashed: "bad", deleted: "bad", suspended: "bad", false: "dim", dry_run: "warn", planned: "warn", pending: "warn", expired: "warn", deploying: "acc" };
const pill = (v, tone) => `<span class="pill p-${tone || TONE[String(v)] || "x"}">${esc(v)}</span>`;
function cell(col, v) {
  if (v === null || v === undefined || v === "") return '<span class="jsn">—</span>';
  if (["status", "kind", "tier", "handled", "done", "executed"].includes(col)) return pill(v);
  if (col === "type") return `<span style="color:${evColor(String(v))}">${esc(v)}</span>`;
  if (["ts", "created_at", "received_at", "next_at", "exp"].includes(col)) return `<span class="idc">${fmtTs(v)}</span>`;
  if (col === "id" || col.endsWith("_id") || col === "tenant") return `<span class="idc">${esc(v)}</span>`;
  if (typeof v === "object" && "usd_cents" in v) return `<span style="color:var(--accent)">¢${esc(v.usd_cents)}</span> <span class="jsn">· ${esc(v.calls)} calls · ${esc(v.deploys)} deploys</span>`;
  if (typeof v === "object") { const s = JSON.stringify(v); return `<span class="jsn" title="${esc(s)}">${esc(s.length > 140 ? s.slice(0, 140) + "…" : s)}</span>`; }
  return esc(v);
}
const evColor = t => t.startsWith("cog") ? "var(--accent)" : t.startsWith("grant") ? "var(--ok)" : /fail|crash|denied/.test(t) ? "var(--bad)" : t.startsWith("deploy") || t.startsWith("worker") ? "var(--agent)" : t.startsWith("runtime") || t.startsWith("breakglass") ? "var(--warn)" : "var(--text-2)";
const MARK = `<svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M4 20 L13 5 L22 20 Z M13 5 L13 15 M4 20 L13 15 L22 20" style="stroke:var(--accent)" stroke-width="1.4" stroke-linejoin="round"/><circle cx="13" cy="5" r="2.4" style="fill:var(--accent)"/><circle cx="4" cy="20" r="2.4" style="fill:var(--accent)"/><circle cx="22" cy="20" r="2.4" style="fill:var(--accent)"/><circle cx="13" cy="15" r="2.6" style="fill:var(--ok)"/></svg>`;

// ---- palette + nav (same on every page)
function applyPal(k) { const p = PALS.find(x => x[0] === k) ? k : "piano"; document.documentElement.className = "pal-" + p; ls.set("cos-palette", p); return p; }
let PAL = applyPal(ls.get("cos-palette") || "piano");
function nav(cur) {
  const on = hasKey();
  $("nav").innerHTML = `<a class="brand" href="#/">${MARK}<b>creator-os</b><span class="surface">runtime${HEALTH && HEALTH.version ? " · v" + esc(HEALTH.version) : ""}</span></a>
  <div class="links"><a href="#/" class="${cur ? "" : "on"}">Hub</a>${Object.entries(PAGES).map(([k, p]) => `<a href="#/${k}" class="${cur === k ? "on" : ""}">${p.title}</a>`).join("")}</div>
  <label class="sr" for="idx">Go to page</label><select class="idx" id="idx"><option value="#/">Hub</option>${Object.entries(PAGES).map(([k, p]) => `<option value="#/${k}" ${cur === k ? "selected" : ""}>${p.title}</option>`).join("")}<option value="/docs">Docs</option><option value="/routes">Routes (machine)</option></select>
  <div class="pals" role="group" aria-label="Palette">${PALS.map(p => `<button type="button" data-pal="${p[0]}" aria-pressed="${p[0] === PAL}" aria-label="${p[1]}" title="${p[1]}"><i style="background:${p[2]};box-shadow:0 0 0 2px ${p[3]},0 0 0 3px rgba(255,255,255,.18)"></i></button>`).join("")}</div>
  ${on ? `<span class="who">● admin</span><button type="button" class="navbtn" id="lockb">Lock</button>` : `<button type="button" class="navbtn gold" id="unlockb">Unlock</button>`}`;
  $("idx").onchange = e => { location.href = e.target.value; };
  document.querySelectorAll("[data-pal]").forEach(b => b.onclick = () => { PAL = applyPal(b.dataset.pal); nav(cur); });
  if ($("unlockb")) $("unlockb").onclick = () => { if (KEY()) route(); };
  if ($("lockb")) $("lockb").onclick = lock;
}
function ticker(events) {
  const rows = (events || []).slice(0, 18);
  const item = e => `<div class="tk"><span style="color:var(--dim)">${hhmm(e.ts)}</span><span style="color:${evColor(String(e.type))}">${esc(e.type)}</span><span style="color:var(--muted-2)">${esc(e.actor || "")}</span>${e.tenant ? `<span style="color:var(--faint)">${esc(String(e.tenant).slice(0, 10))}</span>` : ""}</div>`;
  $("tick").innerHTML = `<div class="ticker"><div class="lbl"><span class="pulse"></span>LIVE EVENTS</div><div class="rail">${rows.length ? `<div class="track">${rows.map(item).join("")}${rows.map(item).join("")}</div>` : `<div class="tk" style="color:var(--muted-2)">${hasKey() ? "No events yet." : "Unlock to stream the bus."}</div>`}</div></div>`;
}

// ---- hub
async function hub() {
  nav("");
  const h = HEALTH || await health(); nav("");
  const A = h.armed || {};
  const row = (k, ok, v) => `<div><span style="color:${ok ? "var(--ok)" : "var(--faint)"}">${ok ? "✓" : "—"}</span><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const rest = ["railwayOAuth", "railwayWebhook", "github", "brain", "mesh", "sync"].map(k => `<span class="pill ${A[k] ? "p-ok" : "p-dim"}">${k}</span>`).join(" ");
  $("app").innerHTML = `
  <section class="hero">
    <div style="display:flex;flex-direction:column;gap:22px">
      <div class="eyebrow">The gatekeeper for your agents</div>
      <h1>Agents get grants.<br><span style="color:var(--ok)">Never keys.</span></h1>
      <p>The COG proposes, the gatehouse signs, every deploy is dry-run first. Budgets, a ledger and a kill switch sit under everything — and nothing outside this box holds a root credential.</p>
      <div class="mono" style="display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--muted-2)"><span>◆ attenuation only</span><span>◆ fail closed</span><span>◆ every exit on the ledger</span></div>
    </div>
    <div class="rcpt">
      <div class="hd"><span>RUNTIME · ${esc((h.source || {}).sha256 || "").slice(0, 12)}</span>${h.ok ? (h.killSwitch ? '<span class="pill p-bad">PAUSED</span>' : '<span class="pill p-ok">ONLINE</span>') : '<span class="pill p-bad">DEGRADED</span>'}</div>
      <div class="rows">
        ${row("DATABASE", h.db, h.db ? "Postgres reachable" : "unreachable")}
        ${row("ADMIN", A.admin, A.admin ? "cockpit + admin API" : "RUNTIME_ADMIN_KEY not set")}
        ${row("VAULT", A.vault, A.vault ? "tenant tokens encrypted" : "VAULT_KEY not set")}
        ${row("RAILWAY EXIT", A.railway, A.railway ? "deploys run for real" : "dry-run only")}
        ${row("ANTHROPIC", A.anthropic, A.anthropic ? "COG plan refinement" : "deterministic planner only")}
        ${row("STRIPE", A.stripe, A.stripe ? "billing webhook" : "off")}
        ${row("BRAIN OUT", A.brainOut, A.brainOut ? "events fan out" : "off")}
        ${row("MEMORY BRIDGE", A.cognitiveBridge, A.cognitiveBridge ? "cognitive-mcp sync" : "off")}
      </div>
      <div style="margin:-4px 18px 14px;display:flex;flex-wrap:wrap;gap:6px">${rest}</div>
      ${h.killSwitch ? `<div class="dash"><span>■</span><span>Paused: every grant fails closed until you resume.</span></div>` : `<div class="dash okd"><span>●</span><span>Kill switch off · policy ${esc(h.policy)} · v${esc(h.version)}</span></div>`}
    </div>
  </section>
  <section>
    <div class="sechd"><div><div class="eyebrow" style="margin-bottom:6px">Index</div><h2>Pick one thing</h2></div><span>${hasKey() ? "Each page shows one thing and a way back." : "Unlock to load counts. Pages stay one click away."}</span></div>
    <div class="grid" id="cards">${Object.entries(PAGES).map(([k, p]) => `<a class="card capcard" href="#/${k}" id="c-${k}"><span class="kick">${p.kick}</span><span class="t">${p.title}</span><span class="one">${p.one}</span><span class="big" id="n-${k}">${hasKey() ? "…" : "—"}</span><span class="sub" id="s-${k}">${hasKey() ? "loading" : "locked"}</span>${k === "memory" ? `<div class="recent" id="r-memory"><div style="color:var(--dim);letter-spacing:.08em">LAST REMEMBERED</div></div>` : ""}</a>`).join("")}</div>
    <div class="ctrl"><span class="lab">CONTROLS</span><button type="button" class="btn" id="drain">Drain outbox</button><button type="button" class="btn bad" id="kill">Pause runtime</button><button type="button" class="btn ok" id="resume">Resume</button></div>
    <div class="msg" id="msg"></div>
  </section>`;
  const act = (p, label) => async () => { if (!KEY()) return; const r = await post(p); $("msg").textContent = label + ": " + JSON.stringify(r); HEALTH = null; await health(); hub(); };
  $("drain").onclick = act("/api/admin/outbox/drain", "drain");
  $("kill").onclick = () => confirm("Pause the runtime? Every grant fails closed until you resume.") && act("/api/admin/kill", "pause")();
  $("resume").onclick = act("/api/admin/resume", "resume");
  if (!hasKey()) { ticker([]); return; }
  const [o, m, ev, ob, gr] = await Promise.all([get("/api/admin/overview"), get("/api/admin/memory"), get("/api/admin/events"), get("/api/admin/outbox"), get("/api/admin/grants")]);
  if (o.error) { nav(""); ticker([]); $("msg").innerHTML = `<span style="color:var(--bad)">${esc(o.error)}</span> — unlock again with the key from Railway Variables.`; return; }
  ticker(ev.events || []);
  const sum = a => (a || []).reduce((t, x) => t + (+x.n || 0), 0);
  const by = (a, f) => (a || []).map(x => `${x[f]} ${x.n}`).join(" · ") || "none yet";
  const set = (k, n, s) => { $("n-" + k).innerHTML = n; $("s-" + k).textContent = s; };
  const mem = (m.memories || []), live = mem.filter(x => !x.deleted);

  set("grants", String(gl.filter(live_).length) + "<small>active</small>", `expired ${gl.filter(g => g.status === "active" && !live_(g)).length} · revoked ${gl.filter(g => g.status === "revoked").length}`);
  set("deploys", String(sum(o.deploys)), by(o.deploys, "status"));

  set("ledger", "¢" + (res ? res.usd_cents : 0) + "<small>reserved</small>", (o.ledger || []).map(l => `${l.kind} ${l.usd_cents}`).join(" · ") || "none yet");
  set("events", String((ev.events || []).length) + ((ev.events || []).length >= 300 ? "+" : "") + "<small>on the bus</small>", ev.events && ev.events[0] ? ev.events[0].type + " · " + ago(new Date(ev.events[0].ts).getTime()) : "quiet");

// ---- memory model (colors = estate tokens)
const FAM = { tenant: ["tenant", "var(--accent)"], agent: ["agents", "var(--agent)"], worker: ["workers", "var(--ok)"], fan: ["fans", "var(--warn)"], other: ["other", "var(--muted-2)"] };
const fam = p => p === "tenant" ? "tenant" : p.startsWith("agent:") ? "agent" : p.startsWith("worker:") ? "worker" : p.startsWith("fan:") ? "fan" : "other";
const col = p => FAM[fam(p)][1];
const short = (p, n = 26) => p.length > n ? p.slice(0, n / 2 - 1) + "…" + p.slice(-(n / 2 - 1)) : p;
const dayLabel = v => { const d = new Date(v), t = new Date(); const k = x => x.toDateString(); if (k(d) === k(t)) return "Today"; t.setDate(t.getDate() - 1); if (k(d) === k(t)) return "Yesterday"; return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }); };
const famOrder = p => ["tenant", "agent", "worker", "fan", "other"].indexOf(fam(p));
const M = { view: "ledger", fam: { tenant: true, agent: true, worker: true, fan: true, other: true }, gone: true, q: "", tenant: "" };
function head(k) { const p = PAGES[k]; return `<a class="back" href="#/">← Back to hub</a><div class="phd"><div><div class="eyebrow">${esc(p.kick)}</div><h1>${p.title}</h1><p>${p.one}</p></div></div>`; }
function locked(k) { $("app").innerHTML = head(k) + `<div class="card lockbox"><span>This page reads admin data.</span><button type="button" class="btn gold" id="ul2">Unlock</button><span class="mono" style="font-size:12px">key: Railway → creator-os-runtime → runtime → Variables → RUNTIME_ADMIN_KEY</span></div>`; $("ul2").onclick = () => { if (KEY()) route(); }; }
async function memory() {
  nav("memory"); if (!hasKey()) { ticker([]); return locked("memory"); }
  $("app").innerHTML = head("memory") + `<div class="card empty">loading…</div>`;
  const [m, t, ob] = await Promise.all([get("/api/admin/memory"), get("/api/tenants"), get("/api/admin/outbox")]);
  if (m.error) { nav("memory"); return locked("memory"); }
  const h = HEALTH || await health();
  const all = m.memories || [], tenants = t.tenants || [];
  const tname = id => (tenants.find(x => x.id === id) || {}).name || id;
  const byT = {}; all.forEach(r => byT[r.tenant] = (byT[r.tenant] || 0) + 1);
  const tids = Object.keys(byT).sort((a, b) => byT[b] - byT[a]);
  if (!tids.includes(M.tenant)) M.tenant = tids[0] || "";
  const pending = (ob.outbox || []).filter(x => !x.done).length;
  $("app").innerHTML = head("memory") + (tids.length ? `<div class="card mbar"><label class="sr" for="ten">Tenant</label><select id="ten">${tids.map(id => `<option value="${esc(id)}" ${id === M.tenant ? "selected" : ""}>${esc(tname(id))} · ${byT[id]}</option>`).join("")}</select><span id="chips" class="chips"></span><label class="sr" for="q">Find a memory</label><input id="q" placeholder="find a memory…" value="${esc(M.q)}"><div class="seg" role="group" aria-label="View"><button type="button" id="vL" aria-pressed="${M.view === "ledger"}">Ledger</button><button type="button" id="vM" aria-pressed="${M.view === "map"}">Map</button></div></div>
  <div class="card viz" id="viz"></div><div id="entries"></div><div class="hood" id="hood"></div>` : `<div class="card empty">Nothing remembered yet.</div>`);

  };
  $("ten").onchange = e => { M.tenant = e.target.value; rerender(); };

  $("vL").onclick = setView("ledger"); $("vM").onclick = setView("map");

}
// swimlanes: one lane per partition, time left→right, a dot per memory (hollow = forgotten)
function strip(rows, w) {
  const parts = [...new Set(rows.map(r => r.partition))].sort((a, b) => famOrder(a) - famOrder(b) || a.localeCompare(b));
  const L = Math.min(220, Math.round(w * 0.3)), R = 18, T = 10, lh = 26, h = T + parts.length * lh + 28;
  const vs = rows.map(r => r.version); let lo = Math.min(...vs), hi = Math.max(...vs); if (hi - lo < 120000) { lo -= 60000; hi += 60000; } const pad = (hi - lo) * 0.05; lo -= pad; hi += pad;
  const x = v => L + (v - lo) / (hi - lo) * (w - L - R);
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Memory timeline">`;
  parts.forEach((p, i) => { const y = T + i * lh + lh / 2; s += `<line x1="${L}" x2="${w - R}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${L - 10}" y="${y + 4}" text-anchor="end" style="fill:${col(p)}" font-size="11">${esc(short(p, Math.floor(L / 7.4)))}</text>`; });
  const N = w < 560 ? 1 : w < 900 ? 2 : 4;
  for (let i = 0; i <= N; i++) { const v = lo + (hi - lo) * i / N, xx = x(v); s += `<line x1="${xx}" x2="${xx}" y1="${T}" y2="${h - 24}" style="stroke:var(--line-2)" stroke-dasharray="2 5"/><text x="${xx}" y="${h - 7}" text-anchor="${i === 0 ? "start" : i === N ? "end" : "middle"}" style="fill:var(--dim)" font-size="10">${esc(new Date(v).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }))}</text>`; }
  rows.forEach(r => { const y = T + parts.indexOf(r.partition) * lh + lh / 2, c = col(r.partition); s += `<circle class="dot" data-id="${esc(r.id)}" cx="${x(r.version).toFixed(1)}" cy="${y}" r="5.5" style="fill:${r.deleted ? "var(--panel)" : c};stroke:${c};filter:drop-shadow(0 0 4px ${r.deleted ? "transparent" : c})" stroke-width="2"><title>${esc(r.partition + (r.key ? " / " + r.key : "") + "\n" + r.content.slice(0, 160))}</title></circle>`; });
  return s + "</svg>";
}
// map: tenant at the center, families as sectors, partitions on the ring, memories as leaves
function mapView(rows, name, w) {
  const h = Math.round(Math.max(380, Math.min(640, w * 0.6))), cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 26;
  const groups = {}; rows.forEach(r => (groups[r.partition] = groups[r.partition] || []).push(r));
  const parts = Object.keys(groups).sort((a, b) => famOrder(a) - famOrder(b) || a.localeCompare(b));
  const fams = [...new Set(parts.map(fam))]; const nPer = f => parts.filter(p => fam(p) === f).length;
  let a = -Math.PI / 2; const sector = {}; fams.forEach(f => { const span = 2 * Math.PI * nPer(f) / parts.length; sector[f] = [a, a + span]; a += span; });
  const pt = (ang, r) => [cx + Math.cos(ang) * r, cy + Math.sin(ang) * r];
  let lines = "", nodes = "", labels = "";
  fams.forEach(f => { const [a0, a1] = sector[f], c = FAM[f][1], mid = (a0 + a1) / 2, [fx, fy] = pt(mid, R * 0.33);
    lines += `<line x1="${cx}" y1="${cy}" x2="${fx}" y2="${fy}" style="stroke:${c}" stroke-opacity=".5" stroke-width="2"/>`;
    nodes += `<circle cx="${fx}" cy="${fy}" r="7" style="fill:${c};filter:drop-shadow(0 0 6px ${c})"/>`; labels += `<text x="${fx}" y="${fy - 13}" text-anchor="middle" style="fill:${c}" font-size="12" font-weight="600">${FAM[f][0]}</text>`;
    const ps = parts.filter(p => fam(p) === f); ps.forEach((p, i) => { const ang = a0 + (a1 - a0) * (i + 0.5) / ps.length, [px, py] = pt(ang, R * 0.68);
      lines += `<line x1="${fx}" y1="${fy}" x2="${px}" y2="${py}" style="stroke:${c}" stroke-opacity=".35"/>`; nodes += `<circle cx="${px}" cy="${py}" r="5" style="fill:${c}"/>`;
      const right = Math.cos(ang) >= 0; labels += `<text x="${px + (right ? 9 : -9)}" y="${py + 4}" text-anchor="${right ? "start" : "end"}" style="fill:var(--text-2)" font-size="11">${esc(short(p.replace(/^[a-z]+:/, ""), 22))}</text>`;
      const ms = groups[p]; ms.forEach((r, j) => { const la = ang + (j - (ms.length - 1) / 2) * 0.11, [lx, ly] = pt(la, R * 0.93);
        lines += `<line x1="${px}" y1="${py}" x2="${lx}" y2="${ly}" style="stroke:${c}" stroke-opacity=".22"/>`;
        nodes += `<circle class="dot" data-id="${esc(r.id)}" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" style="fill:${r.deleted ? "var(--panel)" : c};stroke:${c}" stroke-width="1.5"><title>${esc(r.partition + (r.key ? " / " + r.key : "") + "\n" + r.content.slice(0, 160))}</title></circle>`; }); }); });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Memory map">${lines}${nodes}<circle cx="${cx}" cy="${cy}" r="15" style="fill:var(--accent);filter:drop-shadow(0 0 12px var(--accent))"/><circle cx="${cx}" cy="${cy}" r="6" style="fill:var(--bg)"/><text x="${cx}" y="${cy + 34}" text-anchor="middle" style="fill:var(--text)" font-size="13" font-weight="600">${esc(name)}</text>${labels}</svg>`;
}

// ---- spoke pages (tables)
async function page(k) {
  const p = PAGES[k]; if (!p) return hub(); if (k === "memory") return memory();
  nav(k); if (!hasKey()) { ticker([]); return locked(k); }
  $("app").innerHTML = head(k) + `<div class="card empty">loading…</div>`;
  const d = await get(p.api);
  if (d.error) { nav(k); if (d.error === "admin_required" || d.error === "unauthorized") return locked(k); $("app").innerHTML = head(k) + `<div class="card empty" style="color:var(--bad)">${esc(d.error)}${d.detail ? " — " + esc(JSON.stringify(d.detail)) : ""}</div>`; return; }
  const rows = d[Object.keys(d).find(x => Array.isArray(d[x])) || ""] || [];
  if (k === "grants") rows.forEach(r => { if (r.status === "active" && +r.exp * 1000 < Date.now()) r.status = "expired"; });
  const act = r => k === "grants" && r.status === "active" && String(r.sub || "").startsWith("connector:") ? `<button type="button" class="btn bad" style="height:32px;padding:0 10px;font-size:12px" data-rv="${esc(r.id)}">Revoke</button>` : "";
  $("app").innerHTML = head(k) + `<div class="card tblcard">${rows.length ? `<div class="tblwrap"><table class="tbl"><thead><tr>${p.cols.map(c => `<th scope="col">${esc(c.replace(/_/g, " "))}</th>`).join("")}${k === "grants" ? '<th scope="col"><span class="sr">action</span></th>' : ""}</tr></thead><tbody>${rows.map(r => `<tr>${p.cols.map(c => `<td>${cell(c, r[c])}</td>`).join("")}${k === "grants" ? `<td>${act(r)}</td>` : ""}</tr>`).join("")}</tbody></table></div>` : `<div class="empty">Nothing here yet.</div>`}</div><div class="hood">${rows.length} rows · newest first · source ${esc(p.api)}${k === "grants" ? " · connector grants (Claude sign-ins) can be revoked here" : ""}</div>`;
  document.querySelectorAll("[data-rv]").forEach(b => b.onclick = async () => { if (!confirm("Revoke this connector? That app loses access right away.")) return; b.disabled = true; await post(`/api/admin/grants/${b.dataset.rv}/revoke`); page("grants"); });
}
// ---- connect: an app (Claude) asks through the mcp gate; the owner approves here and a limited grant is minted in this browser
const GATES = ["https://mcp-gate-production.up.railway.app"]; // only these gates may receive a grant from this page
const HOUSE = "RightOnPar (house)";
async function mintConnector() {
  const A = async (p, o = {}) => { const r = await fetch(p, { ...o, headers: { authorization: "Bearer " + KEY(), "content-type": "application/json" } }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "http " + r.status); return j; };
  let root = null, ten = ((await A("/api/tenants")).tenants || []).find(x => x.name === HOUSE && x.status === "active");
  if (!ten) { const c = await A("/api/tenants", { method: "POST", body: JSON.stringify({ name: HOUSE, tier: "house", railwayProjects: [] }) }); ten = c.tenant; root = c.rootGrant.token; }
  if (!root) {
    const now = Date.now() / 1000, g = ((await A("/api/admin/grants")).grants || []).find(x => x.tenant === ten.id && +x.depth === 0 && x.status === "active" && +x.exp > now + 31 * 86400);
    root = g ? (await A(`/api/admin/grants/${g.id}/token`, { method: "POST" })).token : (await A(`/api/tenants/${ten.id}/root-grant`, { method: "POST", body: JSON.stringify({ sub: "tenant:root" }) })).token;
  }
  const r = await fetch("/api/grants", { method: "POST", headers: { authorization: "Bearer " + root, "content-type": "application/json" }, body: JSON.stringify({ sub: "connector:claude", caps: ["memory.read", "memory.write", "cog.plan"], ttlSec: 30 * 86400, scope: { memory: { partitions: ["tenant", "agent:claude"] }, railway: { projects: [], environments: [] } }, budget: { usd_cents: 0, calls: 20000, deploys: 0 }, constraints: { maxWorkers: 0, allowDelete: false, requireDryRun: true } }) });
  const j = await r.json().catch(() => ({})); root = null;
  if (!j.token) throw new Error(j.error || "mint_failed");

}
async function connect(qs) {
  nav(""); ticker([]);
  const p = new URLSearchParams(qs || ""), gate = (p.get("gate") || "").replace(/\/$/, ""), req = p.get("req") || "", client = p.get("client") || "An app", to = p.get("to") || "?";
  if (!GATES.includes(gate) || !/^[0-9a-f]{32}$/.test(req)) { $("app").innerHTML = `<div class="phd"><div><div class="eyebrow">connect</div><h1>Not a valid sign-in</h1><p>This link didn't come from your gate, so nothing was shared.</p></div></div>`; return; }
  const row = (ok, k, v) => `<div><span style="color:${ok ? "var(--ok)" : "var(--faint)"}">${ok ? "✓" : "✗"}</span><span class="k">${k}</span><span class="v">${v}</span></div>`;
  $("app").innerHTML = `<div class="phd"><div><div class="eyebrow">Connect</div><h1>${esc(client)} wants in</h1><p>It talks to this runtime through your gate, with its own grant — never your key.</p></div></div>
  <div class="rcpt" style="max-width:640px"><div class="hd"><span>GRANT · connector:claude</span><span class="pill p-acc">30 DAYS</span></div>
  <div class="rows">${row(1, "MEMORY", "read + write · tenant, agent:claude")}${row(1, "COG", "ask for plans — never executes")}${row(0, "DEPLOY", "no workers, restarts or deletes")}${row(0, "MONEY", "no spend, no ledger")}${row(0, "GRANTS", "can't mint more power")}</div>
  <div class="dash okd"><span>↩</span><span>Sends you back to ${esc(to)} · cancel anytime on the Grants page</span></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;padding:0 18px 18px"><button type="button" class="btn gold" id="ok">Approve</button><button type="button" class="btn" id="no">Deny</button></div></div>
  <div class="msg" id="msg">${hasKey() ? "" : "Approve asks for your admin key first — same as Unlock."}</div>`;

  $("ok").onclick = async () => { if (!KEY()) return; $("ok").disabled = true; $("msg").textContent = "minting a limited grant…"; try { send("approve", await mintConnector()); } catch (e) { $("ok").disabled = false; $("msg").innerHTML = `<span style="color:var(--bad)">Couldn't mint: ${esc(e.message)}</span>`; } };
}
const route = () => { const raw = (location.hash || "#/").replace(/^#\/?/, ""), [k, qs] = raw.split("?"); window.scrollTo(0, 0); if (k === "connect") return connect(qs); (k ? page(k) : hub()); if (k && !hasKey()) return; if (k) get("/api/admin/events").then(e => ticker(e.events || [])).catch(() => ticker([])); };
addEventListener("hashchange", route);
health().then(route);
