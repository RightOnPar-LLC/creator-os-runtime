# The cancel, the sweep and the capture, really at the same time, on the Postgres production runs
# (test/concurrency-real-pg.mjs; src/README.md, "Real concurrency").
#
# NOT the gate for ship-on-green: that is test.yml. This runs only on a pull request that touches the
# files it is about, or by hand. It never runs on a push to master, so it can neither hold up nor start
# a deploy. DO NOT make it a required check: it does not run for pull requests outside the paths below,
# and a required check that never runs leaves a pull request waiting for good. Its races are timing: a
# red run here is looked at, not waved through, and not rerun until green. Exit 3 ("nothing wrong, but
# a race was never seen") is red here too; its counts were first set on one machine, so if this runner
# is steadily short of one, raise the rounds rather than drop the check.
name: concurrency (real Postgres)

on:
  workflow_dispatch:
  pull_request:
    paths:
      # the code the races run through, and the arithmetic they are checked against
      - src/grants.js
      - src/escrow.js
      - src/db.js
      - src/policy.js
      # the Bun and the client it is run with (step 0 of the script is a fact about this Bun)
      - test/package.json
      - test/package-lock.json
      - deploy/Dockerfile
      - test/concurrency-real-pg.mjs
      - .github/workflows/concurrency-real-pg.yml

permissions:
  contents: read

concurrency:
  group: concurrency-real-pg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The official image Railway's postgres-ssl:18 (production) is built on. It lives for this job only,
      # so its password is no secret.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install the pinned test toolchain
        run: npm ci
        working-directory: test

      - name: The races, with every balance checked after every round
        run: node test/concurrency-real-pg.mjs

      - name: Controls (one rule taken out of the source at a time; each must go red)
        run: node test/concurrency-real-pg.mjs --controls
